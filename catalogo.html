<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Encabezado de la tienda -->

    <!-- CARRUSEL DE IMÁGENES PROMOCIONALES DINÁMICO (Limpio) -->
    <div id="contenedor-carrusel" class="w-full bg-white border-b shadow-sm relative z-30 hidden">
        <div class="max-w-6xl mx-auto relative overflow-hidden h-40 md:h-64 lg:h-80 group">

                <!-- Se llena por JS -->
            </div>
            <button id="btn-prev" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/60 text-white w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center backdrop-blur-sm transition-all opacity-0 group-hover:opacity-100 font-black">❮</button>
            <button id="btn-next" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/60 text-white w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center backdrop-blur-sm transition-all opacity-0 group-hover:opacity-100 font-black">❯</button>
            <div id="carousel-dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2"></div>
        </div>
    </div>

    <!-- Filtros de Categoría DINÁMICOS (Barra Pegajosa Blindada) -->
    <div class="sticky top-0 z-[100] bg-white border-b-2 border-pink-100 shadow-md w-full">
        <div id="contenedor-filtros" class="overflow-x-auto whitespace-nowrap px-4 py-3 text-center scroll-smooth">
            <!-- Se dibujan por JS -->
        </div>
    </div>

    <!-- Carga -->
    <div id="loader" class="flex flex-col items-center justify-center py-20 px-4 text-center">

        <p id="loader-text" class="text-gray-500 font-bold animate-pulse">Conectando. Obteniendo productos...</p>
    </div>

    <!-- Cuadrícula -->
    <main class="max-w-6xl mx-auto p-4 sm:p-6 pb-24">
        <div id="catalogo-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
    </main>

    <!-- BOTÓN CARRITO -->
    <button onclick="toggleCarrito()" class="fixed bottom-6 right-6 bg-green-500 text-white p-4 rounded-full shadow-2xl hover:bg-green-600 transition-transform hover:scale-110 z-50 flex items-center justify-center border-4 border-white">

        </svg>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-black px-2.5 py-1 rounded-full shadow-md border-2 border-white">0</span>
    </button>

    <!-- MODAL CARRITO -->

            <div class="p-5 bg-pink-600 text-white flex justify-between items-center shadow-md z-10">
                <h2 class="text-xl font-black uppercase italic flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    Mi Pedido
                </h2>
                <button onclick="toggleCarrito()" class="text-3xl font-black hover:text-pink-200 transition-colors leading-none">&times;</button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <div id="carrito-items" class="space-y-3">
                    <p class="text-center text-gray-400 font-bold mt-10">Tu carrito está vacío.</p>
                </div>
            </div>
            <div class="p-6 bg-white border-t-2 border-pink-100 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)]">
                <div class="flex justify-between items-end mb-4">
                    <span class="font-black text-gray-500 uppercase text-sm">Total del pedido:</span>
                    <span id="carrito-total" class="text-3xl font-black text-pink-600">Q 0.00</span>
                </div>
                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-4 rounded-xl flex items-center justify-center gap-3 transition-transform active:scale-95 shadow-lg uppercase text-sm border-b-4 border-green-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.323-.297-.124-1.758-.867-2.03-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.099-.297-.124-1.254-.462-2.39-1.45-1.121-.976-1.879-2.181-2.052-2.479-.173-.298-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.496-.075-.124-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/></svg>
                    Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        let productosGlobales = [];
        let categoriaActiva = 'TODOS';
        let carritoCliente = []; 
        const NUMERO_WHATSAPP = "50238301196"; 
        
        let slideActual = 0;
        let intervaloCarrusel;
        let numBanners = 0;

        auth.signInAnonymously().then(() => {
            console.log("Conectado como cliente anónimo");
            cargarDatos();
        }).catch((error) => {
            document.getElementById('spinner').classList.add('hidden');
            document.getElementById('loader-text').innerHTML = `<span class="text-red-500 font-black">Error de conexión</span>`;
            document.getElementById('loader-text').classList.remove('animate-pulse');
        });

        function cargarDatos() {
            // 1. Obtener la Configuración para los Banners de Firebase
            database.ref('tienda_datos/config').on('value', (snapConf) => {
                const conf = snapConf.val();
                let banners = [];
                if (conf) {
                    if (conf.banner_1 && conf.banner_1.trim() !== "") banners.push(conf.banner_1.trim());
                    if (conf.banner_2 && conf.banner_2.trim() !== "") banners.push(conf.banner_2.trim());
                    if (conf.banner_3 && conf.banner_3.trim() !== "") banners.push(conf.banner_3.trim());
                }
                iniciarCarrusel(banners);
            });

            // 2. Obtener los Productos
            database.ref('tienda_datos/productos').on('value', (snap) => {
                const data = snap.val();
                if (data) {
                    productosGlobales = Array.isArray(data) ? data : Object.values(data);
                    document.getElementById('loader').classList.add('hidden');
                    generarBotonesCategorias();
                    renderizarCatalogo();
                } else {
                    document.getElementById('spinner').classList.add('hidden');
                    document.getElementById('loader-text').innerText = "El catálogo está vacío.";
                    document.getElementById('loader-text').classList.remove('animate-pulse');
                }
            });
        }

        // --- INICIADOR DINÁMICO DE CARRUSEL ---
        function iniciarCarrusel(listaBanners) {
            const contenedor = document.getElementById('contenedor-carrusel');
            const track = document.getElementById('carousel-track');
            const dots = document.getElementById('carousel-dots');
            
            clearInterval(intervaloCarrusel); // Limpiar cualquier giro anterior
            
            if (!listaBanners || listaBanners.length === 0) {
                contenedor.classList.replace('block', 'hidden');
                contenedor.style.display = 'none';
                return;
            }

            contenedor.classList.replace('hidden', 'block');
            contenedor.style.display = 'block';
            numBanners = listaBanners.length;
            slideActual = 0;

            track.innerHTML = listaBanners.map(img => `<img src="${img}" class="w-full h-full object-cover flex-shrink-0" onerror="this.src='https://placehold.co/1200x400/ff9ed2/db2777?text=ERROR+EN+EL+LINK'">`).join('');
            
            if (numBanners > 1) {
                dots.innerHTML = listaBanners.map((_, i) => `<div class="w-2 h-2 rounded-full transition-all ${i === 0 ? 'bg-white scale-125' : 'bg-white/50'}"></div>`).join('');
                document.getElementById('btn-prev').onclick = () => moverCarousel(-1);
                document.getElementById('btn-next').onclick = () => moverCarousel(1);
                intervaloCarrusel = setInterval(() => moverCarousel(1), 4000);
                document.getElementById('btn-prev').style.display = 'flex';
                document.getElementById('btn-next').style.display = 'flex';
            } else {
                dots.innerHTML = '';
                document.getElementById('btn-prev').style.display = 'none';
                document.getElementById('btn-next').style.display = 'none';
            }
            track.style.transform = `translateX(0%)`;
        }

        function moverCarousel(direccion) {
            if (numBanners <= 1) return;
            slideActual = (slideActual + direccion + numBanners) % numBanners;
            document.getElementById('carousel-track').style.transform = `translateX(-${slideActual * 100}%)`;
            
            const dots = document.getElementById('carousel-dots').children;
            Array.from(dots).forEach((dot, i) => {
                dot.className = `w-2 h-2 rounded-full transition-all ${i === slideActual ? 'bg-white scale-125' : 'bg-white/50'}`;
            });

            clearInterval(intervaloCarrusel);
            intervaloCarrusel = setInterval(() => moverCarousel(1), 4000);
        }

        function generarBotonesCategorias() {
            const contenedor = document.getElementById('contenedor-filtros');
            let categoriasUnicas = new Set();
            
            productosGlobales.forEach(p => {
                const stockTotal = (p.stock_maria || 0) + (p.stock_marisol || 0);
                if (stockTotal > 0) {
                    let cat = (p.categoria && p.categoria.trim() !== '') ? p.categoria.trim().toUpperCase() : 'OTROS';
                    categoriasUnicas.add(cat);
                }
            });

            categoriasUnicas = Array.from(categoriasUnicas).sort();

            let htmlBotones = `
                <button onclick="filtrarCat('TODOS')" class="filtro-btn inline-block mx-1 px-4 py-2 bg-pink-600 text-white rounded-full font-bold text-xs uppercase shadow" data-cat="TODOS">Todos</button>
                <button onclick="filtrarCat('OFERTAS')" class="filtro-btn inline-block mx-1 px-4 py-2 bg-red-600 text-white rounded-full font-black text-xs uppercase shadow animate-pulse hover:bg-red-700 transition" data-cat="OFERTAS">🔥 Ofertas</button>
            `;

            categoriasUnicas.forEach(cat => {
                htmlBotones += `<button onclick="filtrarCat('${cat}')" class="filtro-btn inline-block mx-1 px-4 py-2 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-full font-bold text-xs uppercase transition" data-cat="${cat}">${cat}</button>`;
            });

            contenedor.innerHTML = htmlBotones;
            resaltarBotonActivo();
        }

        function filtrarCat(cat) {
            categoriaActiva = cat;
            resaltarBotonActivo();
            renderizarCatalogo();
        }

        function resaltarBotonActivo() {
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                const catAsignada = btn.getAttribute('data-cat');
                if (catAsignada === 'OFERTAS') {
                    btn.className = categoriaActiva === 'OFERTAS' 
                        ? "filtro-btn inline-block mx-1 px-4 py-2 bg-red-800 text-white rounded-full font-black text-xs uppercase shadow ring-4 ring-red-300"
                        : "filtro-btn inline-block mx-1 px-4 py-2 bg-red-600 text-white rounded-full font-black text-xs uppercase shadow animate-pulse hover:bg-red-700 transition";
                } else {
                    btn.className = categoriaActiva === catAsignada
                        ? "filtro-btn inline-block mx-1 px-4 py-2 bg-pink-600 text-white rounded-full font-bold text-xs uppercase shadow"
                        : "filtro-btn inline-block mx-1 px-4 py-2 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-full font-bold text-xs uppercase transition";
                }
            });
        }

        function obtenerPrecioOferta(p) {
            if (p.precio_oferta && p.oferta_inicio && p.oferta_fin) {
                const hoy = new Date(); 
                hoy.setHours(0,0,0,0);
                const [iY, iM, iD] = p.oferta_inicio.split('-'); 
                const [fY, fM, fD] = p.oferta_fin.split('-');
                const inicio = new Date(iY, iM-1, iD);
                const fin = new Date(fY, fM-1, fD, 23, 59, 59);
                if (hoy >= inicio && hoy <= fin) return parseFloat(p.precio_oferta);
            }
            return null;
        }

        function toggleCarrito() {
            const modal = document.getElementById('modal-carrito');
            if (modal.classList.contains('hidden')) {
                modal.classList.replace('hidden', 'flex');
            } else {
                modal.classList.replace('flex', 'hidden');
            }
        }

        function agregarAlCarrito(codigo) {
            const prod = productosGlobales.find(p => p.codigo === codigo);
            if (!prod) return;

            const precioOferta = obtenerPrecioOferta(prod);
            const precioFinal = precioOferta !== null ? precioOferta : parseFloat(prod.venta);
            const indexExistente = carritoCliente.findIndex(item => item.codigo === codigo);
            
            if (indexExistente > -1) {
                carritoCliente[indexExistente].cant++;
            } else {
                carritoCliente.push({
                    codigo: prod.codigo,
                    nombre: prod.nombre,
                    precio: precioFinal,
                    imagen: prod.imagen || `https://placehold.co/400x400/fbcfe8/db2777?text=${prod.nombre.charAt(0)}`,
                    cant: 1
                });
            }

            actualizarCarritoUI();

            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 right-6 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-sm font-bold animate-bounce z-40 border-2 border-green-500 flex items-center gap-2';
            toast.innerHTML = '🛒 Añadido al pedido';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1800);
        }

        function cambiarCant(index, cantidad) {
            carritoCliente[index].cant += cantidad;
            if (carritoCliente[index].cant < 1) carritoCliente.splice(index, 1);
            actualizarCarritoUI();
        }

        function eliminarItem(index) {
            carritoCliente.splice(index, 1);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const conteo = carritoCliente.reduce((sum, item) => sum + item.cant, 0);
            document.getElementById('cart-count').innerText = conteo;

            const contenedor = document.getElementById('carrito-items');
            let total = 0;
            
            if (carritoCliente.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-gray-400 font-bold mt-10">Tu carrito está vacío.</p>';
                document.getElementById('carrito-total').innerText = 'Q 0.00';
                return;
            }

            let html = '';
            carritoCliente.forEach((item, index) => {
                const subtotal = item.cant * item.precio;
                total += subtotal;

                html += `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border shadow-sm relative">
                        <img src="${item.imagen}" class="w-16 h-16 object-cover rounded-xl border border-gray-100">
                        <div class="flex-1 pr-2">
                            <h4 class="text-[11px] font-bold text-gray-800 leading-tight mb-1 uppercase">${item.nombre}</h4>
                            <p class="text-sm font-black text-pink-600">Q${item.precio.toFixed(2)}</p>
                        </div>
                        <div class="flex flex-col items-center gap-2 border-l pl-3">
                            <div class="flex items-center bg-gray-100 rounded-lg overflow-hidden border">
                                <button onclick="cambiarCant(${index}, -1)" class="w-7 h-7 flex justify-center items-center text-gray-600 font-bold hover:bg-gray-200 transition">-</button>
                                <span class="w-6 text-center text-xs font-black text-gray-800">${item.cant}</span>
                                <button onclick="cambiarCant(${index}, 1)" class="w-7 h-7 flex justify-center items-center text-gray-600 font-bold hover:bg-gray-200 transition">+</button>
                            </div>
                            <button onclick="eliminarItem(${index})" class="text-[9px] text-red-500 font-bold uppercase hover:underline">Eliminar</button>
                        </div>
                    </div>
                `;
            });

            contenedor.innerHTML = html;
            document.getElementById('carrito-total').innerText = `Q ${total.toFixed(2)}`;
        }

        function enviarPedidoWhatsApp() {
            if (carritoCliente.length === 0) return alert("¡Tu carrito está vacío! Agrega algunos productos primero.");

            let total = 0;
            let mensaje = "¡Hola Variedades M&M! 👋 Quiero hacer el siguiente pedido:\n\n";

            carritoCliente.forEach(item => {
                const subtotal = item.cant * item.precio;
                total += subtotal;
                mensaje += `🔹 ${item.cant}x ${item.nombre} (Q${item.precio.toFixed(2)} c/u) = Q${subtotal.toFixed(2)}\n`;
            });

            mensaje += `\n*TOTAL DEL PEDIDO: Q${total.toFixed(2)}*\n\n¡Quedo a la espera de su confirmación para coordinar la entrega!`;
            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function renderizarCatalogo() {
            const contenedor = document.getElementById('catalogo-grid');
            const busqueda = document.getElementById('buscador').value.toLowerCase();
            
            let htmlHTML = ''; 
            let mostrados = 0;

            productosGlobales.forEach(p => {
                if (!p) return; 

                const stockTotal = (p.stock_maria || 0) + (p.stock_marisol || 0);
                if (stockTotal <= 0) return; 

                const precioOferta = obtenerPrecioOferta(p);
                const hayOferta = precioOferta !== null;
                const precioFinal = hayOferta ? precioOferta : p.venta;

                const catProducto = (p.categoria && p.categoria.trim() !== '') ? p.categoria.trim().toUpperCase() : 'OTROS';

                if (categoriaActiva === 'OFERTAS' && !hayOferta) return; 
                if (categoriaActiva !== 'TODOS' && categoriaActiva !== 'OFERTAS' && catProducto !== categoriaActiva) return; 

                if (busqueda && !p.nombre.toLowerCase().includes(busqueda)) return;

                mostrados++;

                const urlImagen = p.imagen ? p.imagen : `https://placehold.co/400x400/fbcfe8/db2777?text=${p.nombre.charAt(0)}`;

                htmlHTML += `
                    <div class="bg-white rounded-3xl shadow-sm hover:shadow-xl transition-all border border-gray-100 overflow-hidden flex flex-col group">
                        <div class="relative h-40 sm:h-48 w-full bg-gray-50 flex items-center justify-center p-2">
                            <img src="${urlImagen}" alt="${p.nombre}" class="max-h-full max-w-full object-cover mix-blend-multiply transition-transform group-hover:scale-105 rounded-t-xl" onerror="this.src='https://placehold.co/400x400/fbcfe8/db2777?text=M&M'">
                            ${hayOferta ? `<span class="absolute top-2 right-2 bg-red-500 text-white font-black text-[10px] px-2 py-1 rounded-full shadow-md animate-bounce">¡OFERTA!</span>` : ''}
                        </div>
                        
                        <div class="p-4 flex flex-col flex-1">
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mb-1">${catProducto}</p>
                            <h3 class="font-bold text-gray-800 text-sm leading-tight flex-1 mb-2">${p.nombre}</h3>
                            
                            <div class="mt-auto">
                                ${hayOferta ? `
                                    <p class="text-xs text-gray-400 line-through font-semibold">Q${(p.venta || 0).toFixed(2)}</p>
                                    <p class="text-xl font-black text-red-600">Q${precioFinal.toFixed(2)}</p>
                                ` : `
                                    <p class="text-xl font-black text-indigo-700">Q${(precioFinal || 0).toFixed(2)}</p>
                                `}
                            </div>
                            
                            <button onclick="agregarAlCarrito('${p.codigo}')" class="w-full mt-4 bg-pink-600 hover:bg-pink-700 text-white font-black py-3 rounded-2xl text-xs flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-md uppercase">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                Añadir al Carrito
                            </button>
                        </div>
                    </div>
                `;
            });

            if (mostrados === 0) {
                htmlHTML = '<div class="col-span-full text-center py-20 text-gray-400 font-bold">No hay productos en esta categoría o búsqueda.</div>';
            }

            document.getElementById('catalogo-grid').innerHTML = htmlHTML;
        }
    </script>
</body>
</html>
