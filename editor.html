<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Realtime - Variedades Marisol</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 550px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .resumen-categorias { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .cat-card { flex: 1; padding: 15px; border-radius: 12px; color: white; font-weight: bold; }
        .cat-libreria { background: linear-gradient(135deg, #0984e3, #74b9ff); }
        .cat-maquillaje { background: linear-gradient(135deg, #e84393, #fd79a8); }
        .cat-card span { display: block; font-size: 11px; opacity: 0.9; }
        .cat-card strong { font-size: 20px; }
        .venta-card { background: #fff; border-radius: 12px; border-left: 6px solid #6c5ce7; margin: 10px 0; padding: 15px; text-align: left; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .monto { font-size: 18px; font-weight: bold; color: #2ecc71; }
        .monto.anulada { color: #ff7675 !important; text-decoration: line-through; opacity: 0.5; }
        .total-dia { font-size: 24px; font-weight: bold; color: #fff; background: #2d3436; padding: 20px; border-radius: 15px; margin-top: 25px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Variedades Marisol</h1>
    <p id="fecha-actual" style="font-weight:bold; color:#636e72;"></p>
    <div class="resumen-categorias">
        <div class="cat-card cat-libreria"><span>📚 LIBRERÍA</span><strong id="total-libreria">Q 0.00</strong></div>
        <div class="cat-card cat-maquillaje"><span>💄 MAQUILLAJE</span><strong id="total-maquillaje">Q 0.00</strong></div>
    </div>
    <div id="lista-ventas">Cargando...</div>
    <div class="total-dia" id="gran-total">Total Hoy: Q 0.00</div>
</div>

<script>
    const url = "https://variedadesmm-38061-default-rtdb.firebaseio.com/inventario_excel.json";
    
    function obtenerFecha() { 
        return new Date().toLocaleDateString('en-GB'); 
    }
    
    document.getElementById("fecha-actual").innerText = "Resumen de hoy: " + obtenerFecha();

    // Limpieza de montos para asegurar que el 0.50 se sume como número
    const limpiarMonto = (m) => {
        if (!m) return 0;
        let s = m.toString().replace(/Q/g, '').replace(/,/g, '').trim();
        let n = parseFloat(s) || 0;
        return n;
    };

    async function cargar() {
        try {
            const res = await fetch(url + "?nocache=" + new Date().getTime());
            const datos = await res.json();
            if (!datos) return;

            let sumaLib = 0, sumaMaq = 0, sumaTotalGral = 0, tickets = {}, hoy = obtenerFecha();

            Object.keys(datos).forEach(id => {
                let v = datos[id];
                if (v.fecha === hoy) {
                    let m = limpiarMonto(v.total || v.monto);
                    let cat = v.categoria ? v.categoria.toUpperCase() : "";
                    
                    if (!tickets[v.numFactura]) {
                        tickets[v.numFactura] = { hora: v.hora, total: 0, anulado: false };
                    }
                    
                    if (v.estado === "ANULADA") {
                        tickets[v.numFactura].anulado = true;
                    } else {
                        // AQUÍ ESTÁ EL CAMBIO: Sumar al ticket
                        tickets[v.numFactura].total += m;
                        
                        // Y sumar a las categorías solo si NO está anulada
                        if (cat.includes("LIBRER")) sumaLib += m;
                        if (cat.includes("MAQUILL")) sumaMaq += m;
                    }
                }
            });

            let html = "";
            let keys = Object.keys(tickets).sort((a,b) => b-a);
            
            // RESETEAMOS EL TOTAL GENERAL PARA RECALCULAR SOBRE TICKETS VÁLIDOS
            sumaTotalGral = 0;

            keys.forEach(num => {
                let t = tickets[num];
                if (!t.anulado) {
                    sumaTotalGral += t.total;
                }
                html += `
                <div class="venta-card">
                    <div><strong>Ticket: ${num}</strong><br><small>${t.hora || ''}</small></div>
                    <div class="monto ${t.anulado ? 'anulada' : ''}">
                        ${t.anulado ? 'ANULADA' : 'Q' + t.total.toFixed(2)}
                    </div>
                </div>`;
            });

            document.getElementById("lista-ventas").innerHTML = html;
            
            // ASIGNACIÓN FINAL (Esto hará que 62 + 4.50 = 66.50)
            document.getElementById("total-libreria").innerText = "Q " + sumaLib.toFixed(2);
            document.getElementById("total-maquillaje").innerText = "Q " + sumaMaq.toFixed(2);
            document.getElementById("gran-total").innerText = "Total Hoy: Q " + sumaTotalGral.toFixed(2);

        } catch (e) { console.error(e); }
    }

    setInterval(cargar, 3000); 
    cargar();
</script>
</body>
</html>
