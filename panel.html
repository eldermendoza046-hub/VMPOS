<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANEL MAESTRO - CONTROL DE FRANQUICIAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    
    <script>
        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDbO2-MazSUKp-sXo9Xh7f7dg4NFpSkH70",
            authDomain: "variedadesmm-38061.firebaseapp.com",
            databaseURL: "https://variedadesmm-38061-default-rtdb.firebaseio.com", 
            projectId: "variedadesmm-38061",
            storageBucket: "variedadesmm-38061.firebasestorage.app",
            messagingSenderId: "670155683804",
            appId: "1:670155683804:web:96b1c633a2da387cb5c119"
        };
        // App Principal (Para Base de Datos y tu sesión de Admin)
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // App Secundaria (Aislada para crear clientes sin cerrar tu sesión)
        const secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp");
    </script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-6">

    <!-- CONTENEDOR DE NOTIFICACIONES FLOTANTES -->
    <div id="toast-container" class="fixed bottom-10 right-10 z-[9999] flex flex-col gap-3"></div>

    <!-- 🔥 MODAL DE LOGIN 🔥 -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-[9990] backdrop-blur-md">
        <div class="bg-gray-800 p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-sm text-center border-4 border-blue-500">
            <h2 class="text-2xl font-black mb-2 text-blue-400 uppercase italic">Seguridad Admin</h2>
            <p class="text-gray-400 text-xs mb-6 font-bold">Inicia sesión con tu correo de administrador.</p>
            <input type="email" id="login-user" placeholder="Tu correo de Admin" class="w-full p-4 bg-gray-900 border border-gray-600 rounded-xl mb-4 outline-none focus:border-blue-500 font-bold text-white">
            <input type="password" id="login-pass" placeholder="Tu Contraseña" class="w-full p-4 bg-gray-900 border border-gray-600 rounded-xl mb-6 outline-none focus:border-blue-500 font-bold text-white" onkeypress="if(event.key==='Enter') ejecutarLogin()">
            <button onclick="ejecutarLogin()" id="btn-login" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 shadow-lg transition-transform active:scale-95 uppercase">Entrar al Panel</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado -->
        <header class="flex justify-between items-center bg-gray-800 p-6 rounded-2xl shadow-xl mb-6 border border-gray-700">
            <div>
                <h1 class="text-3xl font-black text-blue-400 uppercase italic tracking-widest">Súper Admin</h1>
                <p class="text-gray-400 text-sm font-bold">Gestión de Clientes y Suscripciones POS</p>
            </div>
            <div class="flex gap-4 items-center">
                <button onclick="cerrarSesionAdmin()" class="bg-red-900/40 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-lg font-black text-xs uppercase border border-red-800 transition">Cerrar Sesión</button>
                <div class="bg-gray-900 px-4 py-2 rounded-lg border border-gray-700 text-center">
                    <p class="text-[10px] text-gray-500 uppercase font-black">Clientes Activos</p>
                    <p id="contador-clientes" class="text-2xl font-black text-green-400">0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
 <!-- Formulario Nuevo Cliente -->
<div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 h-fit">
    <h2 class="text-xl font-black mb-4 text-white uppercase italic">➕ Alta de Nuevo Cliente</h2>
    
    <div class="space-y-4 font-bold text-xs">
        <div>
            <label class="text-gray-400 uppercase">ID Único (Sin espacios, ej: ferreteria_sol)</label>
            <input type="text" id="cli-id" class="w-full p-3 bg-gray-900 border border-gray-600 rounded-xl text-white outline-none focus:border-blue-500" placeholder="ID del sistema">
        </div>
        <div>
            <label class="text-gray-400 uppercase">Nombre Comercial del Negocio</label>
            <input type="text" id="cli-nombre" class="w-full p-3 bg-gray-900 border border-gray-600 rounded-xl text-white outline-none focus:border-blue-500 uppercase" placeholder="Ej: Ferretería El Sol">
        </div>
        <div>
            <label class="text-gray-400 uppercase">Correo (Para Iniciar Sesión)</label>
            <input type="email" id="cli-correo" class="w-full p-3 bg-gray-900 border border-gray-600 rounded-xl text-white outline-none focus:border-blue-500" placeholder="correo@empresa.com">
        </div>
        <div>
            <label class="text-gray-400 uppercase">Contraseña (Mín 6 Caracteres)</label>
            <input type="password" id="cli-pass" class="w-full p-3 bg-gray-900 border border-gray-600 rounded-xl text-white outline-none focus:border-blue-500" placeholder="••••••••">
        </div>
        <div>
            <label class="text-gray-400 uppercase text-yellow-400">Fecha Límite de Pago (Corte)</label>
            <input type="date" id="cli-fecha" class="w-full p-3 bg-gray-900 border border-yellow-600 rounded-xl text-yellow-400 outline-none focus:border-yellow-400">
        </div>

        <!-- 🔥 NUEVA SECCIÓN FEL (Oculta por defecto) 🔥 -->
        <div class="border border-gray-600 p-4 rounded-xl mt-2 bg-gray-900/50">
            <label class="flex items-center gap-2 cursor-pointer text-blue-400 uppercase font-black">
                <input type="checkbox" id="check-fel" onchange="document.getElementById('campos-fel').style.display = this.checked ? 'block' : 'none'" class="w-4 h-4 accent-blue-500">
                Activar Facturación (FEL)
            </label>
            
            <div id="campos-fel" style="display: none;" class="mt-4 space-y-3">
                <div>
                    <label class="text-gray-500 uppercase text-[10px]">NIT Emisor (Sin guiones)</label>
                    <input type="text" id="fel-nit" class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500" placeholder="Ej: 12345678">
                </div>
                <div>
                    <label class="text-gray-500 uppercase text-[10px]">Certificador Autorizado</label>
                    <select id="fel-certificador" class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500 uppercase">
                        <option value="INFILE">Infile</option>
                        <option value="MEGAPRINT">Megaprint</option>
                        <option value="SAT">SAT (Gratuito)</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-500 uppercase text-[10px]">Token / Firma (Llave API)</label>
                    <input type="password" id="fel-token" class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-white outline-none focus:border-blue-500" placeholder="Pega el token aquí...">
                </div>
            </div>
        </div>
        <!-- FIN SECCIÓN FEL -->

        <button onclick="crearCliente()" id="btn-crear" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-black uppercase transition-colors shadow-lg mt-2">Crear y Activar Cliente</button>
    </div>
</div>


            <!-- Lista de Clientes -->
            <div class="lg:col-span-2 bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h2 class="text-xl font-black mb-4 text-white uppercase italic">🏢 Directorio de Suscripciones</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="text-gray-400 uppercase font-black border-b border-gray-700 text-[10px]">
                            <tr>
                                <th class="pb-3">Negocio / ID</th>
                                <th class="pb-3 text-center">Estado</th>
                                <th class="pb-3 text-center">Vencimiento</th>
                                <th class="pb-3 text-right">Renovar (+30 Días)</th>
                                <th class="pb-3 text-center">Gestión</th>
                            </tr>
                        </thead>
                        <tbody id="lista-clientes" class="divide-y divide-gray-700/50">
                            <!-- Se llena con JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS LOCAL PARA REFRESCO INSTANTÁNEO ---
        let suscripcionesGlobal = {};

        function sysToast(mensaje, tipo = 'success') {
            const toast = document.createElement('div');
            let color = tipo === 'error' ? 'bg-red-600 border-red-800' : (tipo === 'warning' ? 'bg-yellow-500 border-yellow-700' : 'bg-green-500 border-green-700');
            toast.className = `px-6 py-4 rounded-xl shadow-2xl text-sm font-black text-white border-2 ${color} transition-all transform duration-300 translate-y-0 opacity-100 flex items-center gap-2`;
            toast.innerHTML = mensaje;
            
            const container = document.getElementById('toast-container');
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date();
            hoy.setMonth(hoy.getMonth() + 1);
            document.getElementById('cli-fecha').value = hoy.toISOString().split('T')[0];

            auth.onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('login-modal').style.display = 'none';
                    cargarDatos();
                } else {
                    document.getElementById('login-modal').style.display = 'flex';
                }
            });
        });

        function ejecutarLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('btn-login');
            
            if(!u || !p) return sysToast("❌ Por favor ingresa tu correo y contraseña.", 'error');
            btn.innerText = "VERIFICANDO...";
            
            auth.signInWithEmailAndPassword(u, p).catch((error) => {
                btn.innerText = "ENTRAR AL PANEL";
                sysToast("❌ Acceso Denegado. Contraseña incorrecta.", 'error');
            });
        }

        function cerrarSesionAdmin() {
            auth.signOut().then(() => {
                suscripcionesGlobal = {};
                document.getElementById('lista-clientes').innerHTML = '';
                sysToast("✅ Sesión cerrada correctamente.");
            });
        }

        function cargarDatos() {
            database.ref('suscripciones').off(); // Limpiamos canales viejos
            database.ref('suscripciones').on('value', snap => {
                suscripcionesGlobal = snap.val() || {};
                renderTabla(); // Dibujamos la tabla
            });
        }

        // 🔥 FUNCIÓN QUE DIBUJA LA PANTALLA A LA VELOCIDAD DE LA LUZ 🔥
        function renderTabla() {
            const tabla = document.getElementById('lista-clientes');
            
            if (Object.keys(suscripcionesGlobal).length === 0) {
                document.getElementById('contador-clientes').innerText = "0";
                tabla.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-500 font-bold">No tienes clientes registrados aún.</td></tr>';
                return;
            }

            let activos = 0;
            const hoy = new Date();
            hoy.setHours(0,0,0,0);

            let htmlContent = '';
            let autoBloqueosPendientes = {};

            Object.entries(suscripcionesGlobal).forEach(([id, datos]) => {
                let fechaCorte = hoy;
                if (datos.fecha_vencimiento) {
                    const parts = datos.fecha_vencimiento.split('-');
                    fechaCorte = new Date(parts[0], parts[1]-1, parts[2]);
                }
                
                const diasRestantes = Math.ceil((fechaCorte - hoy) / (1000 * 60 * 60 * 24));
                
                let estadoHTML = '';
                let colorFondo = '';

                // Reglas visuales
                if (datos.estado === 'BLOQUEADO') {
                    estadoHTML = `<span class="bg-red-900/50 text-red-500 px-3 py-1 rounded-full text-[9px] border border-red-700 font-black animate-pulse">🔴 SUSPENDIDO</span>`;
                    colorFondo = 'bg-red-900/10';
                } else if (diasRestantes < 0) {
                    estadoHTML = `<span class="bg-red-900/50 text-red-500 px-3 py-1 rounded-full text-[9px] border border-red-700 font-black animate-pulse">🔴 VENCIDO (${Math.abs(diasRestantes)} Días)</span>`;
                    colorFondo = 'bg-red-900/20';
                    if (datos.estado !== 'BLOQUEADO') autoBloqueosPendientes[`suscripciones/${id}/estado`] = 'BLOQUEADO';
                } else if (diasRestantes <= 3) {
                    estadoHTML = `<span class="bg-yellow-900/50 text-yellow-500 px-3 py-1 rounded-full text-[9px] border border-yellow-700 font-black">⚠️ PAGO PRÓXIMO (${diasRestantes} Días)</span>`;
                    activos++;
                } else {
                    estadoHTML = `<span class="bg-green-900/50 text-green-400 px-3 py-1 rounded-full text-[9px] border border-green-700 font-black">🟢 ACTIVO</span>`;
                    activos++;
                }

                const btnBloqueo = datos.estado === 'BLOQUEADO' || diasRestantes < 0 
                    ? `<button onclick="cambiarEstado('${id}', 'ACTIVO', ${diasRestantes})" class="text-green-500 hover:bg-green-900/50 px-3 py-2 rounded-lg font-black text-xs transition border border-transparent hover:border-green-800">Reactivar</button>`
                    : `<button onclick="cambiarEstado('${id}', 'BLOQUEADO', ${diasRestantes})" class="text-red-500 hover:bg-red-900/50 px-3 py-2 rounded-lg font-black text-xs transition border border-transparent hover:border-red-800">Suspender</button>`;

                htmlContent += `
                    <tr class="${colorFondo} hover:bg-gray-700/30 transition-colors">
                        <td class="py-4">
                            <p class="font-black text-white text-sm">${datos.nombre_negocio}</p>
                            <p class="text-[10px] text-gray-400 font-mono">${id} | ${datos.email}</p>
                        </td>
                        <td class="py-4 text-center">${estadoHTML}</td>
                        <td class="py-4 text-center font-bold text-gray-300 text-xs">${datos.fecha_vencimiento}</td>
                        <td class="py-4 text-right">
                            <button onclick="renovarMes('${id}', '${datos.fecha_vencimiento}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-600 px-3 py-1 rounded text-[10px] font-black transition uppercase">
                                💸 Pagar Mes
                            </button>
                        </td>
                        <td class="py-4 text-center flex justify-center items-center gap-1">
                            ${btnBloqueo}
                            <button onclick="eliminarClienteCompleto('${id}', '${datos.nombre_negocio}')" class="text-gray-500 hover:text-red-500 hover:bg-red-900/20 p-2 rounded-lg font-black text-xs transition" title="Eliminar definitivamente">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            tabla.innerHTML = htmlContent;
            document.getElementById('contador-clientes').innerText = activos;

            // Bloqueos automáticos de fondo sin interrumpir la vista
            if (Object.keys(autoBloqueosPendientes).length > 0) {
                database.ref().update(autoBloqueosPendientes);
            }
        }

        // 🔥 FUNCIONES CON ACTUALIZACIÓN "OPTIMISTA" (TODO OCURRE ADENTRO AL INSTANTE) 🔥
        function cambiarEstado(id, nuevoEstado, diasRestantes) {
            if (nuevoEstado === 'ACTIVO' && diasRestantes < 0) {
                return sysToast("❌ <b>¡DENEGADO!</b> El cliente está vencido. Debes dar clic en 'Pagar Mes'.", 'error');
            }
            
            let accion = nuevoEstado === 'BLOQUEADO' ? 'SUSPENDER' : 'REACTIVAR';
            if(!confirm(`¿Seguro que deseas ${accion} a este cliente?`)) return;

            // 1. FORZAMOS EL CAMBIO EN LA PANTALLA AL INSTANTE (Magia pura)
            if (suscripcionesGlobal[id]) {
                suscripcionesGlobal[id].estado = nuevoEstado;
                renderTabla();
            }

            // 2. Avisamos a Firebase de fondo
            database.ref(`suscripciones/${id}`).update({
                estado: nuevoEstado
            }).then(() => {
                sysToast(`✅ Cliente ${nuevoEstado === 'ACTIVO' ? 'REACTIVADO' : 'SUSPENDIDO'} en el servidor.`);
            });
        }

        function renovarMes(id, fechaActual) {
            if(!confirm("¿Confirmas que el cliente ya pagó? Esto sumará 30 días a su fecha de corte y lo activará automáticamente.")) return;

            const parts = fechaActual.split('-');
            let fechaObj = new Date(parts[0], parts[1]-1, parts[2]);
            fechaObj.setMonth(fechaObj.getMonth() + 1);
            
            let year = fechaObj.getFullYear();
            let month = String(fechaObj.getMonth() + 1).padStart(2, '0');
            let day = String(fechaObj.getDate()).padStart(2, '0');
            let nuevaFecha = `${year}-${month}-${day}`;

            // 1. FORZAMOS EL CAMBIO EN LA PANTALLA AL INSTANTE
            if (suscripcionesGlobal[id]) {
                suscripcionesGlobal[id].fecha_vencimiento = nuevaFecha;
                suscripcionesGlobal[id].estado = 'ACTIVO';
                renderTabla();
            }

            // 2. Avisamos a Firebase
            database.ref(`suscripciones/${id}`).update({
                fecha_vencimiento: nuevaFecha,
                estado: 'ACTIVO'
            }).then(() => {
                sysToast("✅ Pago registrado. Se sumaron 30 días y el cliente está ACTIVO.");
            });
        }

        function crearCliente() {
            const id = document.getElementById('cli-id').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const nombre = document.getElementById('cli-nombre').value.trim().toUpperCase();
            const email = document.getElementById('cli-correo').value.trim().toLowerCase();
            const pass = document.getElementById('cli-pass').value.trim();
            const fecha = document.getElementById('cli-fecha').value;

            if (!id || !nombre || !email || !pass || !fecha) return sysToast("❌ Llena todos los campos.", 'warning');
            if (pass.length < 6) return sysToast("❌ La contraseña debe tener al menos 6 caracteres.", 'warning');

            const btn = document.getElementById('btn-crear');
            btn.innerText = "CREANDO...";
            btn.disabled = true;

            secondaryApp.auth().setPersistence(firebase.auth.Auth.Persistence.NONE)
            .then(() => {
                return secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
            })
            .then(() => {
                const nuevoCliente = {
                    nombre_negocio: nombre, email: email, fecha_vencimiento: fecha, estado: "ACTIVO", fecha_creacion: new Date().toISOString()
                };

                database.ref(`suscripciones/${id}`).set(nuevoCliente).then(() => {
                    database.ref(`clientes_datos/${id}/config`).set({
                        nombre_tienda: nombre, mensaje_ticket: "¡GRACIAS POR SU COMPRA!", desc_activo: "NO", tamano_ticket: "72mm"
                    }).then(() => {
                        sysToast(`✅ ¡Éxito! El cliente ${nombre} ha sido creado.`);
                        document.getElementById('cli-id').value = '';
                        document.getElementById('cli-nombre').value = '';
                        document.getElementById('cli-correo').value = '';
                        document.getElementById('cli-pass').value = '';
                        btn.innerText = "CREAR Y ACTIVAR CLIENTE";
                        btn.disabled = false;
                    });
                }).catch(err => {
                    sysToast("❌ Error al guardar en base de datos.", 'error');
                    btn.innerText = "CREAR Y ACTIVAR CLIENTE";
                    btn.disabled = false;
                });
            })
            .catch((error) => {
                btn.innerText = "CREAR Y ACTIVAR CLIENTE";
                btn.disabled = false;
                if(error.code === 'auth/email-already-in-use') {
                    if(confirm("Este correo ya se había creado antes. ¿Deseas forzar la creación de la carpeta de este cliente ahora mismo?")) {
                        const nuevoCliente = { nombre_negocio: nombre, email: email, fecha_vencimiento: fecha, estado: "ACTIVO", fecha_creacion: new Date().toISOString() };
                        database.ref(`suscripciones/${id}`).set(nuevoCliente).then(() => {
                            database.ref(`clientes_datos/${id}/config`).set({
                                nombre_tienda: nombre, mensaje_ticket: "¡GRACIAS POR SU COMPRA!", desc_activo: "NO", tamano_ticket: "72mm"
                            }).then(() => sysToast("✅ ¡Carpeta forzada y creada con éxito!"));
                        });
                    }
                } else {
                    sysToast("❌ Error de Firebase: " + error.message, 'error');
                }
            });
        }

        function eliminarClienteCompleto(id, nombre) {
            let codigoConfirmacion = prompt(`⚠️ ¡PELIGRO DE BORRADO IRREVERSIBLE! ⚠️\n\nEstás a punto de borrar para siempre TODO el inventario de "${nombre}".\n\nSi estás absolutamente seguro, escribe la palabra BORRAR en mayúsculas:`);
            
            if (codigoConfirmacion === "BORRAR") {
                Promise.all([
                    database.ref(`suscripciones/${id}`).remove(),
                    database.ref(`clientes_datos/${id}`).remove()
                ]).then(() => {
                    sysToast(`✅ Datos del cliente "${nombre}" eliminados por completo.`);
                }).catch(err => {
                    sysToast("❌ Ocurrió un error al intentar borrar.", 'error');
                });
            } else {
                sysToast("⚠️ Operación cancelada. El cliente no fue borrado.", 'warning');
            }
        }
    </script>
</body>
